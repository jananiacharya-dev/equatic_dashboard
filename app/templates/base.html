<!doctype html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter+Tight:wght@400;500;600;700&display=swap">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equatic Plant Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
    <header>
        <nav class="tabs">
            {% for page in pages %}
            <a class="tab{% if page == current_page %} active{% endif %}" href="/{{ page }}">{{ page | replace("_", " ") | title }}</a>
            {% endfor %}
        </nav>
        <nav class="range-presets">
            {% for preset in range_presets %}
            <a class="preset{% if preset == current_range %} active{% endif %}" href="{{ request.path }}?range={{ preset }}">{{ preset }}</a>
            {% endfor %}
            <span class="range-nav">
                <a class="range-arrow" href="{{ request.path }}?range={{ current_range }}&offset={{ current_offset + 1 }}" title="Previous {{ current_range }}">&larr;</a>
                <span class="range-window">{{ window_display }}</span>
                {% if current_offset > 0 %}
                <a class="range-arrow" href="{{ request.path }}?range={{ current_range }}&offset={{ current_offset - 1 }}" title="Next {{ current_range }}">&rarr;</a>
                {% else %}
                <span class="range-arrow disabled">&rarr;</span>
                {% endif %}
            </span>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
